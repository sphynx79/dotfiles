# Configurazione condivisa del layout a tre zone (workspace 1, monitor ultrawide).
# Letta da:
#   - layouts/three-zone.lua      (layout Lua di Hyprland, solo geometria)
#   - bin/center-group-daemon     (gruppo automatico della zona centrale)
#   - bin/center-window-switcher  (overlay walker delle finestre centrali)
# Formato: KEY="VALUE", liste separate da spazi. Il file e' source-abile da bash.
# Hot reload: le modifiche si applicano da sole entro ~2s (demone + layout).
# Solo THREE_ZONE_WORKSPACES richiede hyprctl reload (workspace rule).

THREE_ZONE_MONITOR="DP-1"
THREE_ZONE_WORKSPACES="1"

# Percentuali delle zone (normalizzate sulla somma, quindi non devono fare 1 esatto)
THREE_ZONE_LEFT_PCT="0.36"
THREE_ZONE_CENTER_PCT="0.47"
THREE_ZONE_RIGHT_PCT="0.17"

# La spaziatura visiva tra zone/finestre viene da general:gaps_in e gaps_out di
# hyprland.lua (il layout piazza box logici contigui, come gli altri layout tiled).

# Classi finestra per zona (whitelist esplicita: tutto il resto finisce al centro
# ma NON viene mai inserito nel gruppo dal demone)
THREE_ZONE_LEFT_CLASSES="vivaldi-stable vivaldi firefox zen brave-browser chromium"
THREE_ZONE_CENTER_CLASSES="kitty kitty-nvim Alacritty mousepad sublime_text md.obsidian.Obsidian code codium dev.zed.Zed drawio Typora SmartGit searchmonkey com.anthropic.Claude"
THREE_ZONE_RIGHT_CLASSES="org.kde.dolphin org.kde.krusader doublecmd"

# Classi che il demone non riporta mai da floating a tiling (solo con --adopt)
THREE_ZONE_ADOPT_SKIP="obsidian searchmonkey"

# Demone: debounce eventi, lock dopo ogni dispatch, pausa dopo un ungroup manuale (secondi)
THREE_ZONE_DEBOUNCE="0.15"
THREE_ZONE_ACTION_GUARD="0.4"
THREE_ZONE_UNGROUP_COOLDOWN="60"
